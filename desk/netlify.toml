# TIRE Desk - Netlify configuration (frontend only)
#
# Netlify serves the static app and one Edge Function that proxies /api/* to
# the TIRE Desk API service on Railway (netlify/edge-functions/api-proxy.ts).
# There are no Netlify Functions and no Netlify scheduled functions: the
# Railway service is the only backend and the only scheduler.
#
# Required Netlify environment variables (Site configuration -> Environment
# variables, scope must include "Functions" so the Edge Function can read them):
#   DESK_API_ORIGIN    https origin of the Railway Desk API service
#   DESK_PROXY_SECRET  same value as DESK_PROXY_SECRET on the Railway service
# Never add Telegram, Upstox, session or password values to this site.

[build]
  command = "npm run build:web"
  publish = "dist"
  edge_functions = "netlify/edge-functions"
  # Deliberately points at a directory that does not exist: the old Netlify
  # Functions (netlify/functions/*) were removed so that Railway is the only
  # backend and the only scheduler. This stops Netlify auto-detecting any copy
  # of them that is still on disk.
  functions = "netlify/functions-removed"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
